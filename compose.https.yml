services:
  app:
    environment:
      COOKIE_SECURE: 'true'
      # Public traffic enters through Caddy; the direct app port is localhost-only.
      FORWARDED_ALLOW_IPS: '*'
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CST_DOMAIN: ${CST_DOMAIN:?Pass --domain your.domain to deploy.sh}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
